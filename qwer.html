<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop Ecommerce</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 1em 0;
    }

    nav ul {
      list-style-type: none;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    nav ul li {
      position: relative;
      margin: 0 15px;
    }

    nav ul li button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 10px 20px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    nav ul li button:hover {
      background-color: #45a049;
    }

    nav ul li ul {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #333;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
    }

    nav ul li ul li {
      text-align: left;
    }

    nav ul li ul li a {
      color: white;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      transition: background-color 0.3s ease;
    }

    nav ul li ul li a:hover {
      background-color: #575757;
    }

    main {
      padding: 20px;
      background-color: #fff;
      margin-top: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to Our Coffee Shop</h1>
  </header>
  <nav>
    <ul>
      <li>
        <button onclick="toggleMenu('coffeeMenu')">Coffee</button>
        <ul id="coffeeMenu" style="display:none;">
          <li><a href="#">Espresso</a></li>
          <li><a href="#">Latte</a></li>
          <li><a href="#">Cappuccino</a></li>
        </ul>
      </li>
      <li>
        <button onclick="toggleMenu('teaMenu')">Tea</button>
        <ul id="teaMenu" style="display:none;">
          <li><a href="#">Green Tea</a></li>
          <li><a href="#">Black Tea</a></li>
          <li><a href="#">Herbal Tea</a></li>
        </ul>
      </li>
      <li>
        <button onclick="toggleMenu('accessoriesMenu')">Accessories</button>
        <ul id="accessoriesMenu" style="display:none;">
          <li><a href="#">Coffee Mugs</a></li>
          <li><a href="#">Grinders</a></li>
          <li><a href="#">Filters</a></li>
        </ul>
      </li>
    </ul>
  </nav>
  <main>
    <p>Explore our wide range of coffee products.</p>
  </main>
  <script>
    function toggleMenu(menuId) {
      var menu = document.getElementById(menuId);
      if (menu.style.display === "none") {
        menu.style.display = "block";
      } else {
        menu.style.display = "none";
      }
    }
  </script>
</body>
</html>
