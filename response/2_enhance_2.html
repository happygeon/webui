<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographer's Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #4a148c;
            color: white;
            padding: 1rem 0;
            text-align: center;
        }
        nav {
            background-color: #5c27ae;
            padding: 0.5rem 0;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 1rem;
        }
        .photo {
            flex: 1 0 calc(33% - 1rem);
            margin: 1rem;
            height: 300px;
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out;
        }
        .photo:hover {
            transform: scale(1.05);
        }
        .photo.fullscreen {
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fullscreen img {
            max-width: 90%;
            max-height: 90%;
        }
        footer {
            background-color: #4a148c;
            color: white;
            text-align: center;
            padding: 1rem 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Photographer's Portfolio</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div id="gallery" class="gallery">
        <div class="photo" onclick="viewFullScreen(this)" style="background-image: url('https://via.placeholder.com/300x300');"></div>
        <div class="photo" onclick="viewFullScreen(this)" style="background-image: url('https://via.placeholder.com/300x300');"></div>
        <div class="photo" onclick="viewFullScreen(this)" style="background-image: url('https://via.placeholder.com/300x300');"></div>
    </div>
    <footer>
        <p>&copy; 2023 Photographer's Portfolio. All rights reserved.</p>
    </footer>

    <script>
        function viewFullScreen(element) {
            const isFullScreen = element.classList.toggle('fullscreen');
            document.body.style.overflow = isFullScreen ? 'hidden' : 'auto';
        }

        window.addEventListener('scroll', function() {
            if (window.innerHeight + window.pageYOffset >= document.body.offsetHeight) {
                loadMorePhotos();
            }
        });

        function loadMorePhotos() {
            const gallery = document.getElementById('gallery');
            for (let i = 0; i < 3; i++) {
                const photoDiv = document.createElement('div');
                photoDiv.className = 'photo';
                photoDiv.style.backgroundImage = `url('https://via.placeholder.com/300x300')`;
                photoDiv.setAttribute('onclick', 'viewFullScreen(this)');
                gallery.appendChild(photoDiv);
            }
        }
    </script>
</body>
</html>
