<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop Ecommerce</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1em 0;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
        }
        nav ul li {
            display: inline-block;
            position: relative;
        }
        nav ul li button {
            background-color: #555;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        nav ul li button:hover {
            background-color: #777;
        }
        nav ul li ul {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #666;
            min-width: 160px;
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
            z-index: 1;
        }
        nav ul li ul li {
            display: block;
        }
        nav ul li ul li a {
            display: block;
            padding: 12px 16px;
            text-decoration: none;
            color: white;
        }
        nav ul li ul li a:hover {
            background-color: #888;
        }
        main {
            padding: 20px;
            text-align: center;
            background-color: #fff;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        @media (max-width: 600px) {
            nav ul li {
                display: block;
                width: 100%;
            }
            nav ul li ul {
                width: 100%;
                left: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Coffee Shop</h1>
    </header>
    <nav>
        <ul>
            <li>
                <button onclick="toggleMenu('coffeeMenu')">Coffee</button>
                <ul id="coffeeMenu" style="display:none;">
                    <li><a href="#">Espresso</a></li>
                    <li><a href="#">Latte</a></li>
                    <li><a href="#">Cappuccino</a></li>
                </ul>
            </li>
            <li>
                <button onclick="toggleMenu('teaMenu')">Tea</button>
                <ul id="teaMenu" style="display:none;">
                    <li><a href="#">Green Tea</a></li>
                    <li><a href="#">Black Tea</a></li>
                    <li><a href="#">Herbal Tea</a></li>
                </ul>
            </li>
            <li>
                <button onclick="toggleMenu('accessoriesMenu')">Accessories</button>
                <ul id="accessoriesMenu" style="display:none;">
                    <li><a href="#">Coffee Mugs</a></li>
                    <li><a href="#">Grinders</a></li>
                    <li><a href="#">Filters</a></li>
                </ul>
            </li>
        </ul>
    </nav>
    <main>
        <p>Explore our wide range of coffee products.</p>
    </main>
    <script>
        function toggleMenu(menuId) {
            var menu = document.getElementById(menuId);
            if (menu.style.display === "none") {
                menu.style.display = "block";
            } else {
                menu.style.display = "none";
            }
        }
    </script>
</body>
</html>
