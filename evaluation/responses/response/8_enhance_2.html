<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            transition: background-color 0.3s ease;
        }
        .dark-mode {
            background-color: #333;
            color: #fff;
        }
        header {
            background-color: #007BFF;
            color: white;
            text-align: center;
            padding: 1em 0;
        }
        nav button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1em;
        }
        main {
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }
        aside {
            width: 25%;
            background-color: #fff;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        section#masonryFeed {
            width: 65%;
            background-color: #fff;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .feed-item {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }
        .feed-item:last-child {
            border-bottom: none;
        }
        h2 {
            margin-top: 0;
        }
        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }
            aside, section#masonryFeed {
                width: 100%;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Social Media Platform</h1>
        <nav>
            <button id="darkModeToggle">Toggle Dark Mode</button>
        </nav>
    </header>

    <main>
        <aside id="notifications">
            <h2>Live Notifications</h2>
            <ul>
                <li>New friend request from John Doe</li>
                <li>You have 5 new likes</li>
                <li>Upcoming event: Webinar at 3 PM</li>
            </ul>
        </aside>

        <section id="masonryFeed">
            <h2>Feed</h2>
            <div class="feed-item">Post 1 Content</div>
            <div class="feed-item">Post 2 Content</div>
            <div class="feed-item">Post 3 Content</div>
            <div class="feed-item">Post 4 Content</div>
            <!-- More feed items can be added here -->
        </section>
    </main>

    <script>
        document.getElementById('darkModeToggle').onclick = function() {
            document.body.classList.toggle('dark-mode');
        };
    </script>
</body>
</html>
