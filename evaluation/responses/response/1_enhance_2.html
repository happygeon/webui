<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Booking Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #007BFF;
            color: white;
            text-align: center;
            padding: 1rem 0;
        }
        main {
            display: flex;
            justify-content: space-around;
            padding: 2rem;
        }
        section {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            width: calc(33% - 1rem);
        }
        h1, h2 {
            color: #007BFF;
        }
        #mapContainer {
            height: 500px;
            width: 100%;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 1rem;
        }
        input, button {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #ddd;
        }
        li:last-child {
            border-bottom: none;
        }
        footer {
            text-align: center;
            padding: 1rem 0;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Travel Booking Platform</h1>
    </header>
    
    <main>
        <section id="map">
            <h2>Interactive Map Search</h2>
            <!-- Placeholder for the map -->
            <div id="mapContainer">
                <p>Map will be displayed here</p>
            </div>
        </section>

        <section id="filter">
            <h2>Filter Listings</h2>
            <!-- Filter options will go here -->
            <form>
                <label for="destination">Destination:</label>
                <input type="text" id="destination" name="destination">
                
                <label for="priceRange">Price Range:</label>
                <input type="text" id="priceRange" name="priceRange">
                
                <label for="travelDate">Travel Date:</label>
                <input type="date" id="travelDate" name="travelDate">
                
                <button type="submit">Search</button>
            </form>
        </section>

        <section id="listings">
            <h2>Listings</h2>
            <!-- Listing items will be displayed here -->
            <ul id="listingItems">
                <li>Listing 1</li>
                <li>Listing 2</li>
                <li>Listing 3</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Travel Booking Platform</p>
    </footer>
</body>
</html>
