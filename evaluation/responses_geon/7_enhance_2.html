<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifestyle Blog</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            display: flex;
            justify-content: space-between;
        }

        nav {
            width: 250px;
            background-color: #333;
            color: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            margin-bottom: 15px;
            border-radius: 5px;
            overflow: hidden;
        }

        nav ul li button {
            background: none;
            border: none;
            width: 100%;
            padding: 10px;
            text-align: left;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        nav ul li button:hover {
            background-color: #555;
        }

        .content {
            flex: 1;
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        .hidden {
            display: none;
        }

        h1 {
            color: #333;
            margin-top: 0;
        }

        p {
            color: #666;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            nav {
                width: 100%;
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                right: -250px;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            nav.open {
                transform: translateX(0);
            }

            .content {
                margin-left: 0;
                padding-top: 60px;
            }

            .menu-toggle {
                display: block;
                position: absolute;
                top: 10px;
                right: 10px;
                cursor: pointer;
                font-size: 24px;
                color: white;
            }
        }
    </style>
</head>
<body>
    <nav>
        <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>
        <ul>
            <li>
                <button onclick="toggleCategory('category1')">Category 1</button>
                <div id="category1" class="hidden">
                    <p>Subcategory 1.1</p>
                    <p>Subcategory 1.2</p>
                </div>
            </li>
            <li>
                <button onclick="toggleCategory('category2')">Category 2</button>
                <div id="category2" class="hidden">
                    <p>Subcategory 2.1</p>
                    <p>Subcategory 2.2</p>
                </div>
            </li>
        </ul>
    </nav>
    <div class="content" id="content">
        <h1>Welcome to the Lifestyle Blog</h1>
        <p>This is where the content will transition with animations.</p>
    </div>

    <script>
        function toggleCategory(categoryId) {
            let category = document.getElementById(categoryId);
            if (category.classList.contains('hidden')) {
                category.classList.remove('hidden');
            } else {
                category.classList.add('hidden');
            }
        }

        function toggleMenu() {
            let nav = document.querySelector('nav');
            nav.classList.toggle('open');
        }
    </script>
</body>
</html>
