<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media Platform</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        transition: background-color 0.3s ease-in-out;
    }
    
    .container {
        width: 80%;
        max-width: 1200px;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    header {
        background-color: #007bff;
        color: white;
        padding: 1rem;
        text-align: center;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    nav button {
        background-color: transparent;
        border: none;
        color: white;
        cursor: pointer;
        font-size: 1rem;
        padding: 0.5rem 1rem;
        transition: background-color 0.3s ease-in-out;
    }

    nav button:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }

    main {
        display: flex;
        flex-grow: 1;
    }

    aside#notifications {
        background-color: #e9ecef;
        padding: 1rem;
        width: 25%;
        box-sizing: border-box;
    }

    aside#notifications h2 {
        margin-top: 0;
        font-size: 1.2rem;
    }

    aside#notifications ul {
        list-style-type: none;
        padding: 0;
    }

    aside#notifications li {
        padding: 0.5rem 0;
        border-bottom: 1px solid #ddd;
    }

    section#masonryFeed {
        width: 75%;
        padding: 1rem;
        box-sizing: border-box;
    }

    section#masonryFeed h2 {
        margin-top: 0;
        font-size: 1.2rem;
    }

    .feed-item {
        background-color: #fff;
        padding: 1rem;
        border-radius: 4px;
        margin-bottom: 1rem;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    }

    .dark-mode {
        background-color: #343a40;
        color: white;
    }

    .dark-mode body {
        background-color: #343a40;
    }

    .dark-mode nav button {
        color: white;
    }

    .dark-mode aside#notifications {
        background-color: #495057;
    }

    .dark-mode .feed-item {
        background-color: #495057;
        color: white;
    }

    .dark-mode .feed-item:hover {
        background-color: #5a6268;
    }
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>Social Media Platform</h1>
        <nav>
            <button id="darkModeToggle">Toggle Dark Mode</button>
        </nav>
    </header>

    <main>
        <aside id="notifications">
            <h2>Live Notifications</h2>
            <ul>
                <li>New friend request from John Doe</li>
                <li>You have 5 new likes</li>
                <li>Upcoming event: Webinar at 3 PM</li>
            </ul>
        </aside>

        <section id="masonryFeed">
            <h2>Feed</h2>
            <div class="feed-item">Post 1 Content</div>
            <div class="feed-item">Post 2 Content</div>
            <div class="feed-item">Post 3 Content</div>
            <div class="feed-item">Post 4 Content</div>
            <!-- More feed items can be added here -->
        </section>
    </main>
</div>

<script>
    document.getElementById('darkModeToggle').onclick = function() {
        document.body.classList.toggle('dark-mode');
    };
</script>
</body>
</html>
