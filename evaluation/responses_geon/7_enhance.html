<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifestyle Blog</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            background-color: #f4f4f4;
        }
        nav {
            width: 250px;
            background-color: #333;
            color: white;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
        }
        nav ul {
            list-style-type: none;
            padding: 0;
        }
        nav ul li {
            margin-bottom: 15px;
        }
        nav ul li button {
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        nav ul li button:hover {
            background-color: #555;
        }
        .content {
            flex: 1;
            padding: 20px;
            transition: opacity 0.5s ease;
        }
        .hidden {
            display: none;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>
                <button onclick="toggleCategory('category1')">Category 1</button>
                <div id="category1" class="hidden">
                    <p>Subcategory 1.1</p>
                    <p>Subcategory 1.2</p>
                </div>
            </li>
            <li>
                <button onclick="toggleCategory('category2')">Category 2</button>
                <div id="category2" class="hidden">
                    <p>Subcategory 2.1</p>
                    <p>Subcategory 2.2</p>
                </div>
            </li>
        </ul>
    </nav>
    <div class="content" id="content">
        <h1>Welcome to the Lifestyle Blog</h1>
        <p>This is where the content will transition with animations.</p>
    </div>

    <script>
        function toggleCategory(categoryId) {
            let category = document.getElementById(categoryId);
            if (category.classList.contains('hidden')) {
                category.classList.remove('hidden');
            } else {
                category.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
